name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: type errors fail the run before the heavier matrix starts.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Verify the published artifact actually builds and the CLI entry runs.
  build:
    name: Build & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify built CLI entry exists
        run: test -f dist/index.js
      - name: Smoke-run built CLI
        run: node dist/index.js --version

  # The docs site only builds in pages.yml, and that workflow never runs on a
  # pull request. Without this job a broken site is first discovered during the
  # deploy after merge. There is no branch protection on this repository yet, so
  # this is an advisory signal rather than a merge gate.
  site:
    name: Docs site build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # upload-pages-artifact v4+ silently drops hidden files. Fail here instead
      # of shipping a site that is missing them.
      - name: Reject hidden files in the built site
        run: |
          found=$(find site/dist -mindepth 1 -name '.*' -print)
          if [ -n "$found" ]; then
            echo "hidden files would be dropped by upload-pages-artifact:"
            echo "$found"
            exit 1
          fi

  # Full test matrix across supported OSes and Node versions.
  test:
    name: Test (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Don't abort the whole matrix when one cell fails — we want the full grid.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22 is the lowest line still supported (maintenance LTS), 24 is active
        # LTS and 26 becomes LTS in 2026-10. Node 20 went end-of-life 2026-04-30.
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Test discovery is handled by scripts/run-tests.mjs (shell- and
      # Node-version-independent), so no special shell is needed here.
      - name: Run tests
        run: npm test
