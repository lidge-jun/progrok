name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npx astro build
        working-directory: site
      # upload-pages-artifact excludes hidden files by default, so a hidden
      # build output would be dropped from the deployed site without any error.
      # This is the deploy gate; ci.yml runs the same check earlier for PR
      # feedback, but this workflow is what actually uploads.
      - name: Reject hidden files in the built site
        run: |
          found=$(find site/dist -mindepth 1 -name '.*' -print)
          if [ -n "$found" ]; then
            echo "these would be silently dropped from the deployed site:"
            echo "$found"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
